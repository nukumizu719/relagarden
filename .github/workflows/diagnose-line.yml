name: Diagnose LINE reception safely

on:
  workflow_dispatch:
    inputs:
      send_owner_test:
        description: Send one fixed diagnostic message to the allowlisted owner
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check LINE channel token safely
        env:
          CHANNEL_ACCESS_TOKEN: ${{ secrets.RELAGARDEN_LINE_CHANNEL_ACCESS_TOKEN }}
        run: |
          set -eu
          set +x
          if [ -z "$CHANNEL_ACCESS_TOKEN" ]; then
            echo 'LINE_BOT_INFO_HTTP=TOKEN_MISSING'
            exit 0
          fi
          response_file="$RUNNER_TEMP/line-bot-info.json"
          status="$(curl -sS -o "$response_file" -w '%{http_code}' \
            -H "Authorization: Bearer $CHANNEL_ACCESS_TOKEN" \
            https://api.line.me/v2/bot/info || true)"
          case "$status" in
            000|2??|4??|5??) echo "LINE_BOT_INFO_HTTP=$status" ;;
            *) echo 'LINE_BOT_INFO_HTTP=UNKNOWN' ;;
          esac
          if [ "$status" = 200 ]; then
            if [ "$(jq -r '.basicId // ""' "$response_file")" = '@073lvwdr' ]; then
              echo 'LINE_BOT_ACCOUNT=MATCH'
            else
              echo 'LINE_BOT_ACCOUNT=MISMATCH'
            fi
          fi

      - name: Check owner-only push route safely
        if: ${{ inputs.send_owner_test == true }}
        env:
          CHANNEL_ACCESS_TOKEN: ${{ secrets.RELAGARDEN_LINE_CHANNEL_ACCESS_TOKEN }}
          OWNER_USER_ID: ${{ secrets.RELAGARDEN_LINE_MANUAL_SEND_ALLOWED_USER_ID }}
        run: |
          set -eu
          set +x
          account_file="$RUNNER_TEMP/line-owner-account.json"
          account_status="$(curl -sS -o "$account_file" -w '%{http_code}' \
            -H "Authorization: Bearer $CHANNEL_ACCESS_TOKEN" \
            https://api.line.me/v2/bot/info || true)"
          if [ "$account_status" != 200 ] \
            || [ "$(jq -r '.basicId // ""' "$account_file")" != '@073lvwdr' ]; then
            echo 'LINE_OWNER_PUSH_HTTP=ACCOUNT_MISMATCH'
            exit 0
          fi
          if [ "${#OWNER_USER_ID}" -ne 33 ] \
            || [ "${OWNER_USER_ID#U}" = "$OWNER_USER_ID" ]; then
            echo 'LINE_OWNER_PUSH_HTTP=OWNER_ID_INVALID'
            exit 0
          fi
          case "${OWNER_USER_ID#U}" in
            ''|*[!0-9A-Fa-f]*) echo 'LINE_OWNER_PUSH_HTTP=OWNER_ID_INVALID'; exit 0 ;;
            *) ;;
          esac
          payload_file="$RUNNER_TEMP/line-owner-push.json"
          response_file="$RUNNER_TEMP/line-owner-push-response.json"
          jq -n \
            --arg to "$OWNER_USER_ID" \
            --arg text '受付AIの送信経路を確認しています。' \
            '{to: $to, messages: [{type: "text", text: $text}]}' \
            > "$payload_file"
          status="$(curl -sS -o "$response_file" -w '%{http_code}' \
            -H "Authorization: Bearer $CHANNEL_ACCESS_TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary "@$payload_file" \
            https://api.line.me/v2/bot/message/push || true)"
          case "$status" in
            000|2??|4??|5??) echo "LINE_OWNER_PUSH_HTTP=$status" ;;
            *) echo 'LINE_OWNER_PUSH_HTTP=UNKNOWN' ;;
          esac

      - name: Read recent safe LINE result codes
        env:
          XSERVER_HOST: ${{ secrets.XSERVER_HOST }}
          XSERVER_USER: ${{ secrets.XSERVER_USER }}
          XSERVER_SSH_KEY: ${{ secrets.XSERVER_SSH_KEY }}
        run: |
          set -eu
          set +x
          umask 077
          key_file="$RUNNER_TEMP/xserver-key"
          known_hosts="$RUNNER_TEMP/known-hosts"
          printf '%s\n' "$XSERVER_SSH_KEY" > "$key_file"
          ssh-keyscan -p 10022 "$XSERVER_HOST" > "$known_hosts" 2>/dev/null
          ssh \
            -i "$key_file" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$known_hosts" \
            -p 10022 \
            "$XSERVER_USER@$XSERVER_HOST" \
            'log="/home/xs674757/relagarden.jp/private/line-storage/logs/$(date -u +%Y-%m).log"; if [ -f "$log" ]; then tail -n 80 "$log"; else echo NO_SAFE_LOG; fi'
