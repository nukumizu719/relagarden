name: Deploy to Xserver

on:
  push:
    branches:
      - main  # mainブランチにpushしたときに実行
  # 手で動かすとき用。設定だけを入れ替えたいときなど、
  # 変更ファイルが無くてもAPIとLINE受信を必ず置き直す。
  workflow_dispatch:

# 複数の更新が続いてもXserverへの転送を同時実行しない。
# 古い途中状態が新しい完成版を上書きする404を防ぐ。
concurrency:
  group: relagarden-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 1つ前のコミットと比べて「どこが変わったか」を見るため、履歴を取る。
          fetch-depth: 0

      # 施工事例を1件足しただけのときに、APIまで毎回置き直さないようにする。
      # 判定できないときは必ず「両方置き直す」へ倒す。
      - name: 配置する場所を決める
        id: targets
        run: |
          set -eu

          before='${{ github.event.before }}'
          after='${{ github.sha }}'
          empty='0000000000000000000000000000000000000000'

          changed=''
          judged=no

          if [ '${{ github.event_name }}' = 'push' ] \
            && [ -n "$before" ] \
            && [ "$before" != "$empty" ] \
            && git cat-file -e "$before^{commit}" 2>/dev/null
          then
            if changed=$(git diff --name-only "$before" "$after" 2>/dev/null); then
              judged=yes
            fi
          fi

          answer="$RUNNER_TEMP/deploy-targets.txt"

          if [ "$judged" = yes ]; then
            count=$(printf '%s\n' "$changed" | grep -c . || true)
            echo "変更されたファイル: ${count}件"
            printf '%s\n' "$changed" | sh scripts/detect-deploy-targets.sh > "$answer"
          else
            echo "変更されたファイルを調べられませんでした。安全側に倒します"
            printf 'api=true\nline=true\n' > "$answer"
          fi

          cat "$answer" >> "$GITHUB_OUTPUT"
          echo "この回の配置:"
          sed 's/^/  /' "$answer"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # package-lock.json のとおりに入れる。毎回同じ結果になる。
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Build Astro
        run: npm run build

      # ------------------------------------------------------------------
      # ホームページ本体の転送。SSHが切れることがあるので、最大3回試す。
      # 20秒あけて、成功した時点で残りは動かさない。
      # 3回とも失敗したときだけ、全体を失敗にする。
      #
      # APIは下の別工程で配置する。Web更新ではapi/全体を守り、
      # API更新では公式LINEの受信口(line/)だけを守る。
      # 2段階の除外は scripts/deploy-exclude-test.sh で確かめる。
      # ------------------------------------------------------------------
      - name: ホームページを転送（1回目）
        id: web1
        continue-on-error: true
        uses: Burnett01/rsync-deployments@7.0.1
        with:
          # APIは別工程で配置する。Web更新でAPIや保存データを消さない。
          switches: -avzr --delete --exclude=api/
          path: dist/
          # 💡 Xserverの公開ディレクトリ
          remote_path: /home/xs674757/relagarden.jp/public_html/
          remote_host: ${{ secrets.XSERVER_HOST }}
          remote_user: ${{ secrets.XSERVER_USER }}
          remote_key: ${{ secrets.XSERVER_SSH_KEY }}
          remote_port: 10022

      - name: 1回目の結果
        run: |
          if [ '${{ steps.web1.outcome }}' = 'success' ]; then
            echo '転送 1回目: 成功'
          else
            echo '転送 1回目: 失敗'
            echo '次の試行まで: 20秒'
          fi

      - name: 20秒待つ（2回目の前）
        if: steps.web1.outcome == 'failure'
        run: sleep 20

      - name: ホームページを転送（2回目）
        id: web2
        if: steps.web1.outcome == 'failure'
        continue-on-error: true
        uses: Burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete --exclude=api/
          path: dist/
          remote_path: /home/xs674757/relagarden.jp/public_html/
          remote_host: ${{ secrets.XSERVER_HOST }}
          remote_user: ${{ secrets.XSERVER_USER }}
          remote_key: ${{ secrets.XSERVER_SSH_KEY }}
          remote_port: 10022

      - name: 2回目の結果
        if: steps.web1.outcome == 'failure'
        run: |
          if [ '${{ steps.web2.outcome }}' = 'success' ]; then
            echo '転送 2回目: 成功'
          else
            echo '転送 2回目: 失敗'
            echo '次の試行まで: 20秒'
          fi

      - name: 20秒待つ（3回目の前）
        if: steps.web1.outcome == 'failure' && steps.web2.outcome == 'failure'
        run: sleep 20

      - name: ホームページを転送（3回目）
        id: web3
        if: steps.web1.outcome == 'failure' && steps.web2.outcome == 'failure'
        continue-on-error: true
        uses: Burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete --exclude=api/
          path: dist/
          remote_path: /home/xs674757/relagarden.jp/public_html/
          remote_host: ${{ secrets.XSERVER_HOST }}
          remote_user: ${{ secrets.XSERVER_USER }}
          remote_key: ${{ secrets.XSERVER_SSH_KEY }}
          remote_port: 10022

      - name: ホームページ転送の結果を確かめる
        run: |
          if [ '${{ steps.web1.outcome }}' = 'success' ] \
            || [ '${{ steps.web2.outcome }}' = 'success' ] \
            || [ '${{ steps.web3.outcome }}' = 'success' ]
          then
            echo 'ホームページの転送: 成功'
          else
            echo '転送 3回目: 失敗'
            echo 'ホームページの転送: 3回とも失敗しました' >&2
            exit 1
          fi

      # ------------------------------------------------------------------
      # 通常API。api/ が変わった回だけ配置する。
      # ------------------------------------------------------------------
      - name: 通常APIは今回そのまま
        if: steps.targets.outputs.api != 'true'
        run: echo 'api/ に変更が無いので、通常APIの配置は行いません'

      - name: Deploy API source outside public_html
        if: steps.targets.outputs.api == 'true'
        uses: Burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete
          path: api/src/
          remote_path: /home/xs674757/relagarden.jp/api-src/
          remote_host: ${{ secrets.XSERVER_HOST }}
          remote_user: ${{ secrets.XSERVER_USER }}
          remote_key: ${{ secrets.XSERVER_SSH_KEY }}
          remote_port: 10022

      - name: Deploy API public entry
        if: steps.targets.outputs.api == 'true'
        uses: Burnett01/rsync-deployments@7.0.1
        with:
          # LINE受信口は別設置。通常APIの更新で消さない。
          switches: -avzr --delete --exclude=line/
          path: api/public/
          remote_path: /home/xs674757/relagarden.jp/public_html/api/
          remote_host: ${{ secrets.XSERVER_HOST }}
          remote_user: ${{ secrets.XSERVER_USER }}
          remote_key: ${{ secrets.XSERVER_SSH_KEY }}
          remote_port: 10022

      # ------------------------------------------------------------------
      # 公式LINEの受信API。api-line/ か配置の手順が変わった回だけ配置する。
      # 通常の掲載APIとは分離したまま。
      # private/ の設定と保存データは対象外なので、ここでは上書きしない。
      # ------------------------------------------------------------------
      # 掲載API・Instagram用の設定を、暗号化Secretsから作って置く。
      # 公式LINE（line-config.php）と同じやり方で、別ファイル・別Secret。
      #
      # **合言葉が未設定なら、何も作らず何も送らない。** デプロイは止めない。
      # GitHub（ホームページ掲載）の項目は入れない。掲載を勝手に有効にしないため。
      - name: Build API config from secrets (never logged)
        if: steps.targets.outputs.api == 'true'
        id: apiconfig
        env:
          PAIRING_CODE: ${{ secrets.RELAGARDEN_API_PAIRING_CODE }}
          IG_USER_ID: ${{ secrets.RELAGARDEN_INSTAGRAM_USER_ID }}
          IG_ACCOUNT_NAME: ${{ secrets.RELAGARDEN_INSTAGRAM_ACCOUNT_NAME }}
          IG_ACCESS_TOKEN: ${{ secrets.RELAGARDEN_INSTAGRAM_ACCESS_TOKEN }}
          IG_APP_ID: ${{ secrets.RELAGARDEN_INSTAGRAM_APP_ID }}
          IG_APP_SECRET: ${{ secrets.RELAGARDEN_INSTAGRAM_APP_SECRET }}
          IG_API_VERSION: ${{ vars.RELAGARDEN_INSTAGRAM_GRAPH_API_VERSION }}
          IG_REDIRECT_URI: https://relagarden.jp/api/instagram/oauth/callback
        run: |
          set -eu

          if [ -z "$PAIRING_CODE" ]; then
            echo "RELAGARDEN_API_PAIRING_CODE が未設定のため、config.php は作りません"
            echo "made=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          safe() {
            name="$1"; value="$2"; least="$3"
            if [ "${#value}" -lt "$least" ]; then
              echo "$name が短すぎます（${least}文字以上）" >&2
              exit 1
            fi
            case "$value" in
              *[!A-Za-z0-9+/=_-]*)
                echo "$name に使えない文字が入っています" >&2
                exit 1
                ;;
            esac
          }

          safe RELAGARDEN_API_PAIRING_CODE "$PAIRING_CODE" 16

          oauth=no
          if [ -n "$IG_APP_ID" ] || [ -n "$IG_APP_SECRET" ]; then
            if [ -z "$IG_APP_ID" ] || [ -z "$IG_APP_SECRET" ] || [ -z "$IG_API_VERSION" ]; then
              echo "Instagram OAuth の設定が途中までしか入っていません" >&2
              echo "  必要: APP_ID / APP_SECRET / GRAPH_API_VERSION" >&2
              exit 1
            fi
            safe RELAGARDEN_INSTAGRAM_APP_ID "$IG_APP_ID" 5
            safe RELAGARDEN_INSTAGRAM_APP_SECRET "$IG_APP_SECRET" 16
            oauth=yes
          fi

          legacy=no
          if [ -n "$IG_USER_ID" ] || [ -n "$IG_ACCOUNT_NAME" ] \
            || [ -n "$IG_ACCESS_TOKEN" ]; then
            if [ -z "$IG_USER_ID" ] || [ -z "$IG_ACCOUNT_NAME" ] \
              || [ -z "$IG_ACCESS_TOKEN" ] || [ -z "$IG_API_VERSION" ]; then
              echo "Instagram の設定が途中までしか入っていません" >&2
              echo "  必要: USER_ID / ACCOUNT_NAME / ACCESS_TOKEN / GRAPH_API_VERSION" >&2
              exit 1
            fi
            safe RELAGARDEN_INSTAGRAM_USER_ID "$IG_USER_ID" 8
            safe RELAGARDEN_INSTAGRAM_ACCOUNT_NAME "$IG_ACCOUNT_NAME" 1
            safe RELAGARDEN_INSTAGRAM_ACCESS_TOKEN "$IG_ACCESS_TOKEN" 32
            legacy=yes
          fi

          if [ "$oauth" = yes ] || [ "$legacy" = yes ]; then
            case "$IG_API_VERSION" in
              v[0-9]*.[0-9]*) ;;
              *) echo "RELAGARDEN_INSTAGRAM_GRAPH_API_VERSION の形が違います（例 v23.0）" >&2; exit 1 ;;
            esac
          fi

          mkdir -p api-config-out
          umask 077
          {
            printf '<?php\n'
            printf '// GitHub Actions が暗号化Secretsから作ります。手で書き換えないでください。\n'
            printf 'return [\n'
            printf "    'pairing_code' => '%s',\n" "$PAIRING_CODE"
            printf "    'storage_dir' => '/home/xs674757/relagarden.jp/private/api-storage',\n"
            printf "    'site_base_url' => 'https://relagarden.jp',\n"
            if [ "$oauth" = yes ]; then
              printf "    'instagram_app_id' => '%s',\n" "$IG_APP_ID"
              printf "    'instagram_app_secret' => '%s',\n" "$IG_APP_SECRET"
              printf "    'instagram_redirect_uri' => '%s',\n" "$IG_REDIRECT_URI"
              printf "    'instagram_graph_api_version' => '%s',\n" "$IG_API_VERSION"
            fi
            if [ "$legacy" = yes ]; then
              printf "    'instagram_user_id' => '%s',\n" "$IG_USER_ID"
              printf "    'instagram_account_name' => '%s',\n" "$IG_ACCOUNT_NAME"
              printf "    'instagram_graph_api_version' => '%s',\n" "$IG_API_VERSION"
              printf "    'instagram_access_token' => '%s',\n" "$IG_ACCESS_TOKEN"
            fi
            printf '];\n'
          } > api-config-out/config.php
          chmod 600 api-config-out/config.php
          echo "made=true" >> "$GITHUB_OUTPUT"
          echo "config.php を作りました（内容は表示しません / OAuth設定=${oauth} / 旧方式=${legacy}）"

      - name: Deploy API config outside public_html
        if: steps.targets.outputs.api == 'true' && steps.apiconfig.outputs.made == 'true'
        uses: Burnett01/rsync-deployments@7.0.1
        with:
          # --delete を付けない。private/ の保存データを消さないため。
          switches: -avz --chmod=F600
          path: api-config-out/config.php
          remote_path: /home/xs674757/relagarden.jp/private/
          remote_host: ${{ secrets.XSERVER_HOST }}
          remote_user: ${{ secrets.XSERVER_USER }}
          remote_key: ${{ secrets.XSERVER_SSH_KEY }}
          remote_port: 10022

      - name: Remove local copy of API config
        if: always()
        run: rm -rf api-config-out

      - name: 公式LINEの受信は今回そのまま
        if: steps.targets.outputs.line != 'true'
        run: echo 'api-line/ に変更が無いので、LINE受信APIと設定の配置は行いません'

      - name: Deploy LINE API source outside public_html
        if: steps.targets.outputs.line == 'true'
        uses: Burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete
          path: api-line/src/
          remote_path: /home/xs674757/relagarden.jp/api-line-src/
          remote_host: ${{ secrets.XSERVER_HOST }}
          remote_user: ${{ secrets.XSERVER_USER }}
          remote_key: ${{ secrets.XSERVER_SSH_KEY }}
          remote_port: 10022

      - name: Deploy LINE API public entry
        if: steps.targets.outputs.line == 'true'
        uses: Burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete
          path: api-line/public/
          remote_path: /home/xs674757/relagarden.jp/public_html/api/line/
          remote_host: ${{ secrets.XSERVER_HOST }}
          remote_user: ${{ secrets.XSERVER_USER }}
          remote_key: ${{ secrets.XSERVER_SSH_KEY }}
          remote_port: 10022

      # 公式LINEの受信に必要な設定を、暗号化Secretsから組み立てて置く。
      #
      # **秘密の値はログへ出さない。** 長さと使ってよい文字だけを確かめ、
      # 足りなければここでデプロイを止める（中途半端な設定を置かない）。
      # 置き場所は public_html の外。受信データ(private/line-storage)は
      # 消さないよう、この工程では --delete を使わない。
      - name: Build LINE config from secrets (never logged)
        if: steps.targets.outputs.line == 'true'
        env:
          CHANNEL_SECRET: ${{ secrets.RELAGARDEN_LINE_CHANNEL_SECRET }}
          CHANNEL_ACCESS_TOKEN: ${{ secrets.RELAGARDEN_LINE_CHANNEL_ACCESS_TOKEN }}
          INBOX_TOKEN: ${{ secrets.RELAGARDEN_LINE_INBOX_TOKEN }}
        run: |
          set -eu

          check() {
            name="$1"; value="$2"; least="$3"
            if [ -z "$value" ]; then
              echo "$name が設定されていません" >&2
              exit 1
            fi
            if [ "${#value}" -lt "$least" ]; then
              echo "$name が短すぎます（${least}文字以上）" >&2
              exit 1
            fi
            case "$value" in
              *[!A-Za-z0-9+/=_-]*)
                echo "$name に使えない文字が入っています" >&2
                exit 1
                ;;
            esac
          }

          check RELAGARDEN_LINE_CHANNEL_SECRET "$CHANNEL_SECRET" 16
          check RELAGARDEN_LINE_CHANNEL_ACCESS_TOKEN "$CHANNEL_ACCESS_TOKEN" 16
          check RELAGARDEN_LINE_INBOX_TOKEN "$INBOX_TOKEN" 64

          mkdir -p line-config-out
          umask 077
          {
            printf '<?php\n'
            printf '// GitHub Actions が暗号化Secretsから作ります。手で書き換えないでください。\n'
            printf 'return [\n'
            printf "    'channel_secret' => '%s',\n" "$CHANNEL_SECRET"
            printf "    'channel_access_token' => '%s',\n" "$CHANNEL_ACCESS_TOKEN"
            printf "    'inbox_token' => '%s',\n" "$INBOX_TOKEN"
            printf "    'storage_dir' => '/home/xs674757/relagarden.jp/private/line-storage',\n"
            printf "    'require_https' => true,\n"
            printf '];\n'
          } > line-config-out/line-config.php
          chmod 600 line-config-out/line-config.php
          echo "line-config.php を作りました（内容は表示しません）"

      - name: Deploy LINE config outside public_html
        if: steps.targets.outputs.line == 'true'
        uses: Burnett01/rsync-deployments@7.0.1
        with:
          # --delete を付けない。private/line-storage の受信データを守るため。
          switches: -avz --chmod=F600
          path: line-config-out/line-config.php
          remote_path: /home/xs674757/relagarden.jp/private/
          remote_host: ${{ secrets.XSERVER_HOST }}
          remote_user: ${{ secrets.XSERVER_USER }}
          remote_key: ${{ secrets.XSERVER_SSH_KEY }}
          remote_port: 10022

      - name: Remove local copy of LINE config
        if: always()
        run: rm -rf line-config-out
